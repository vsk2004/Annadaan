# Server
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:h2:file:./food_donation_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=${JWT_SECRET:food-donation-super-secret-key-change-in-production-minimum-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Password reset and donor notification email (Brevo transactional email API)
brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:projectannadaan@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Annadaan}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.email.notification-radius-km=${EMAIL_NOTIFICATION_RADIUS_KM:10.0}

# SMS Notifications (Twilio / Mock)
sms.enabled=${SMS_ENABLED:false}
sms.provider=${SMS_PROVIDER:mock}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
# Legacy MSG91 configuration fallback (optional)
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.sms-template-id=${MSG91_SMS_TEMPLATE_ID:}
msg91.sender-id=${MSG91_SENDER_ID:}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.sms.notification-radius-km=${SMS_NOTIFICATION_RADIUS_KM:10.0}

# Logging
logging.level.com.fooddonation=INFO
logging.level.org.springframework.security=WARN
